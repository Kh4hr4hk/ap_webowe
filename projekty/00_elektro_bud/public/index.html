<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektro-Bud</title>
    <style>
        input, select{
            border-radius: 5px;
            border: 1px solid #128334;
            padding: 5px;
            width: 200px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- Posluzylam sie troche bootstraopem dla cwiczen jako ze byl na ostatniej lekcji :) -->
</head>
<body class="bg-body">
    <section id="container" class="border border-3 border-subtle-success text-center bg-muted-success mx-auto vh-100 p-3 m-5" style="width: 750px; border-radius: 15px; height: auto; font-family: Manrope; ">
    <h1>Elektro-Bud</h1>
    <h2>Zarejestruj przyjęcie towaru</h2><br>
    <section id="form" class="fs-lg" style=" text-align: left; margin-left: 130px;">
         <label for="nazwa">Nazwa: <input type="text" id="nazwa" style="width: 280px;"></label><br><br>
        <label for="ean">Kod EAN: <input type="text" id="ean"></label><br><br>
        <label for="kategoria" >Kategoria: 
            <select id="kategoria">
                <option value="aparatura">Aparatura</option>
                <option value="kable">Kable</option>
                <option value="przewody">Przewody</option>
                <option value="osprzet">Osprzęt</option>
                <option value="narzedzia">Narzędzia</option>
            </select>
        </label><br><br>
        <label for="ilosc">Ilość sztuk: <input type="number" id="ilosc" style="width: 95px;"></label><br><br>
        <label for="data">Data: <input type="date" id="data" style="width: 140px;"></label><br><br>
        <label for="id">ID pracownika: <input type="number" id="id" style="width: 55px;"></label><br><br>
        <label for="sektor">Sektor: <input type="text" maxlength="1" id="sektor" inputmode="numeric" pattern="[0-9]*" style="width: 75px;"></label>
        <label for="regal">Regał: <input type="text"  maxlength="1"  id="regal" inputmode="numeric" pattern="[0-9]*" style="width: 75px;"></label>
        <label for="polka">Półka: <input type="text" maxlength="1"  id="polka" inputmode="numeric" pattern="[0-9]*" style="width: 75px;"></label>
    </section>
    <br><br>
    <button type="button" id="przyjmij" class="btn-solid theme-success" style="width: 700px;">Przyjmij towar</button><br><br>
    <p style="text-align: left; margin-left: 30px;">Przyjęte towary:  </p>
    <p id="blad" style="color: red;"></p>
    <!-- <textarea id="wynik"  cols="85" ></textarea> -->
     <table id="tabela" class="table theme-inverse table-bordered border-success" style="width: 730px; text-align: center;">
        <thead>
            <tr>
                <th scope="col">EAN</th>
                <th scope="col">Nazwa</th>
                <th scope="col">Kategoria</th>
                <th scope="col">Ilość</th>
                <th scope="col">Miejsce</th>
                <th scope="col">Data</th>
                <th scope="col">Pracownik</th>
            </tr>
        </thead>
        <tbody id="wynikiTabeli" class="table table-bordered border-success table theme-secondary"></tbody>
        </table>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="./main.js" defer></script>
</section>
</body>
</html>
